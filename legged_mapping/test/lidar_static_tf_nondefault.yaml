lidar_static_tf_node:
  ros__parameters:
    rotation_order: "intrinsic_zyx"
    angle_unit: "deg"

    odom_to_tracking_origin.parent_frame: "odom"
    odom_to_tracking_origin.child_frame: "tracking_origin"
    odom_to_tracking_origin.translation_xyz: [0.0, 0.0, 0.0]
    odom_to_tracking_origin.rotation_angles: [10.0, 20.0, 30.0]

    tracking_body_to_base.parent_frame: "tracking_body"
    tracking_body_to_base.child_frame: "base"
    tracking_body_to_base.translation_xyz: [0.0, 0.0, 0.0]
    tracking_body_to_base.rotation_angles: [-15.0, 5.0, 40.0]
